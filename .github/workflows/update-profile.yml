name: Update profile activity
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py
      - name: Render terminal activity visualization
        run: python scripts/render_contributions.py
      - name: Commit changed activity only
        run: |
          if git diff --quiet -- data/contributions.json assets/contributions.svg; then
            echo "No activity visualization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contributions.svg
          git commit -m "chore: update profile activity [skip ci]"
          git push
